<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d6b62"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>GB Kitchen</title>
<style>
:root{--teal:#0d6b62;--deep:#084c47;--cream:#fbf7ed;--sand:#e9dcc4;--ink:#203b36;--muted:#71817a;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}header{background:linear-gradient(135deg,var(--deep),var(--teal));color:white;padding:22px 18px 24px;border-radius:0 0 25px 25px}header small{opacity:.8;letter-spacing:2px}header h1{font-size:26px;margin:5px 0}header p{margin:0;opacity:.85}.wrap{padding:15px;max-width:780px;margin:auto}.tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 14px}.tabs button{white-space:nowrap;border:0;background:#e9e5d9;color:var(--ink);padding:10px 14px;border-radius:22px;font-weight:650}.tabs button.active{background:var(--teal);color:white}.card{background:white;border:1px solid #eee8dc;border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 4px 16px #153e3010}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,textarea{width:100%;padding:12px;border:1px solid #d9ded6;border-radius:11px;background:#fff;font:inherit;color:var(--ink);margin:5px 0}button{cursor:pointer}button.primary{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:12px 15px;font-weight:700}button.secondary{background:var(--sand);border:0;border-radius:11px;padding:10px;color:var(--ink)}button.danger{background:#fee7e2;color:#9c2e20;border:0;border-radius:10px;padding:8px 10px}.muted{color:var(--muted)}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:12px 0}.item:last-child{border:0}.pill{background:#e5f3ed;color:#14634e;border-radius:20px;padding:4px 9px;font-size:12px}.big{font-size:25px;font-weight:750}.hidden{display:none!important}h2{font-size:18px;margin:8px 0 12px}label{font-size:13px;color:var(--muted)}#notice{padding:10px;border-radius:10px;background:#fff4d7;margin:8px 0;display:none}.footer{font-size:12px;color:var(--muted);text-align:center;padding:20px}
</style></head><body>
<header><small>COASTAL • KONKANI • HOMEMADE</small><h1>GB Kitchen</h1><p>Exhibites · Inventory · Sales</p></header>
<div class="wrap">
<div id="notice"></div>
<section id="auth" class="card"><h2>Sign in</h2><p class="muted">Use your GB Kitchen account.</p><input id="email" type="email" placeholder="Email address" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="primary" id="login" style="width:100%">Sign in</button><p id="authmsg" class="muted"></p></section>
<section id="app" class="hidden">
<div class="row"><span id="who" class="muted"></span><button class="secondary" id="logout" style="flex:0 0 auto">Sign out</button></div>
<nav class="tabs" id="tabs"><button class="active" data-tab="dashboard">Home</button><button data-tab="products">Inventory</button><button data-tab="sale">New sale</button><button data-tab="sales">Sales history</button><button data-tab="exhibitions">Exhibitions</button><button data-tab="customers">Customers</button><button data-tab="suppliers">Suppliers</button><button data-tab="expenses">Expenses</button></nav>
<div id="screen"></div></section></div>
<div class="footer">GB Kitchen · Shared cloud records</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,getDocs,doc,updateDoc,deleteDoc,query,orderBy,serverTimestamp,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);let user=null,tab="dashboard",cart=[];
const ownerEmail="nikchit@gmail.com";
function msg(s){$("notice").textContent=s;$("notice").style.display="block";setTimeout(()=>$("notice").style.display="none",4500)}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2})}
function coll(name){return collection(db,name)}
async function all(name){let snap=await getDocs(query(coll(name),orderBy("createdAt","desc")));return snap.docs.map(d=>({id:d.id,...d.data()}))}
async function add(name,data){await addDoc(coll(name),{...data,createdAt:serverTimestamp(),createdBy:user.uid});}
function field(id,label,type="text",placeholder=""){return `<label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}">`}
function select(id,label,opts){return `<label>${label}</label><select id="${id}">${opts.map(x=>`<option>${esc(x)}</option>`).join("")}</select>`}
function form(title,fields,button="Save"){return `<div class="card"><h2>${title}</h2>${fields}<button class="primary" id="save">${button}</button></div>`}
async function render(){
 const s=$("screen");s.innerHTML='<div class="card muted">Loading…</div>';
 try{
 if(tab==="dashboard"){let ps=await all("products"),ss=await all("sales");let today=new Date().toDateString();let todays=ss.filter(x=>x.date===today);s.innerHTML=`<div class="grid"><div class="card"><div class="muted">Products</div><div class="big">${ps.length}</div></div><div class="card"><div class="muted">Sales today</div><div class="big">${todays.length}</div></div><div class="card"><div class="muted">Today's total</div><div class="big">${money(todays.reduce((a,x)=>a+x.total,0))}</div></div><div class="card"><div class="muted">Low stock</div><div class="big">${ps.filter(x=>Number(x.stock)<=Number(x.lowStock||0)).length}</div></div></div><div class="card"><h2>Quick actions</h2><div class="row"><button class="primary" onclick="document.querySelector('[data-tab=sale]').click()">New sale</button><button class="secondary" onclick="document.querySelector('[data-tab=products]').click()">Add product</button></div></div><div class="card"><p>Signed in as <b>${esc(user.email)}</b></p><p class="muted">Records sync live through Firebase for authorized team accounts.</p></div>`}
 if(tab==="products"){let a=await all("products");s.innerHTML=form("Add product",field("pn","Product name")+field("pc","Category")+`<div class="grid">${field("pu","Unit (pcs, kg…)")}${field("price","Selling price","number")}${field("cost","Cost price","number")}${field("stock","Opening stock","number")}${field("low","Low-stock alert at","number")}</div>`)+`<div class="card"><h2>Products (${a.length})</h2>${a.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.category||"")} · ${x.stock} ${esc(x.unit||"")}</div></div><div>${money(x.price)}<br><button class="secondary" data-restock="${x.id}">+ Stock</button></div></div>`).join("")||"No products yet."}</div>`;
 $("save").onclick=async()=>{let name=$("pn").value.trim();if(!name)return msg("Enter product name");await add("products",{name,category:$("pc").value,unit:$("pu").value,price:+$("price").value||0,cost:+$("cost").value||0,stock:+$("stock").value||0,lowStock:+$("low").value||0});msg("Product added");render()};
 s.querySelectorAll("[data-restock]").forEach(b=>b.onclick=async()=>{let n=prompt("Quantity to add?");if(n===null||!Number(n))return;await updateDoc(doc(db,"products",b.dataset.restock),{stock: Number(a.find(x=>x.id===b.dataset.restock).stock)+Number(n)});msg("Stock updated");render()})}
 if(tab==="sale"){let ps=await all("products");s.innerHTML=`<div class="card"><h2>Build bill</h2>${select("prod","Product",ps.map(x=>x.name))}<div class="row">${field("qty","Quantity","number","1")}<button class="secondary" id="addcart" style="flex:0 0 auto">Add item</button></div><div id="cartview"></div>${field("customer","Customer (optional)")}<div class="grid">${select("pay","Payment",["Cash","UPI"])}${select("channel","Sale channel",["Walk-in","WhatsApp","Exhibition"])}</div>${select("ex","Exhibition (if applicable)",["—"])}<div class="big" id="total">Total: ₹0</div><button class="primary" id="record" style="width:100%">Record sale</button></div>`;
 let exs=await all("exhibitions");$("ex").innerHTML=["—",...exs.map(x=>x.name)].map(x=>`<option>${esc(x)}</option>`).join("");
 function cartview(){$("cartview").innerHTML=cart.map((x,i)=>`<div class="item">${esc(x.name)} × ${x.qty}<b>${money(x.price*x.qty)}</b><button class="danger" data-rm="${i}">×</button></div>`).join("");$("total").textContent="Total: "+money(cart.reduce((n,x)=>n+x.qty*x.price,0));$("cartview").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.rm,1);cartview()})}
 $("addcart").onclick=()=>{let p=ps.find(x=>x.name===$("prod").value),q=+$("qty").value;if(!p||q<=0)return msg("Choose product and quantity");let found=cart.find(x=>x.id===p.id);if(found)found.qty+=q;else cart.push({id:p.id,name:p.name,qty:q,price:+p.price||0});cartview()};
 $("record").onclick=async()=>{if(!cart.length)return msg("Add at least one item");try{await runTransaction(db,async tx=>{let refs=cart.map(x=>doc(db,"products",x.id)),snap=[];for(let r of refs)snap.push(await tx.get(r));snap.forEach((d,i)=>{if(!d.exists())throw Error("Product missing");let stock=Number(d.data().stock||0),q=cart[i].qty;if(stock<q)throw Error("Insufficient stock for "+cart[i].name);tx.update(refs[i],{stock:stock-q})});let saleRef=doc(coll("sales"));tx.set(saleRef,{items:cart,total:cart.reduce((n,x)=>n+x.qty*x.price,0),customer:$("customer").value,payment:$("pay").value,channel:$("channel").value,exhibition:$("ex").value,date:new Date().toDateString(),createdAt:serverTimestamp(),createdBy:user.uid})});cart=[];msg("Sale recorded and stock updated");render()}catch(e){msg(e.message)}};
 }
 if(tab==="sales"){let a=await all("sales");s.innerHTML=`<div class="card"><h2>Sales history</h2><div class="big">${money(a.reduce((n,x)=>n+x.total,0))} <span class="muted" style="font-size:13px">all recorded sales</span></div></div>`+a.map(x=>`<div class="card"><div class="item"><div><b>${esc(x.date||"Sale")}</b><div class="muted">${esc(x.payment)} · ${esc(x.channel)} ${x.customer?"· "+esc(x.customer):""}</div><small>${(x.items||[]).map(i=>esc(i.name)+" × "+i.qty).join(", ")}</small></div><b>${money(x.total)}</b></div></div>`).join("")}
 if(["exhibitions","customers","suppliers","expenses"].includes(tab)){let cfg={exhibitions:["Exhibition","Name","name",["location","Location"],["start","Start date"],["end","End date"]],customers:["Customer","Name","name",[ "phone","Phone"],["note","Notes"]],suppliers:["Supplier","Name","name",["phone","Phone"],["note","Notes"]],expenses:["Expense","Description","name",["amount","Amount (₹)"],["category","Category"],["date","Date"]] }[tab];let data=await all(tab);let f=cfg.slice(3).map(([id,l])=>field(id,l,id==="amount"?"number":"text")).join("");s.innerHTML=form("Add "+cfg[0].toLowerCase(),field("name",cfg[1])+f)+`<div class="card"><h2>${cfg[0]} records</h2>${data.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.location||x.phone||x.category||x.date||"")}</div></div><b>${x.amount?money(x.amount):""}</b></div>`).join("")||"No records yet."}</div>`;$("save").onclick=async()=>{let d={name:$("name").value};cfg.slice(3).forEach(([id])=>d[id]=id==="amount"?+$(id).value:$(id).value);if(!d.name)return msg("Enter a name/description");await add(tab,d);msg("Saved");render()}}
 }catch(e){s.innerHTML=`<div class="card">Could not load records.<p class="muted">${esc(e.message)}</p></div>`}
}
$("login").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value)}catch(e){$("authmsg").textContent=e.message}};
$("logout").onclick=()=>signOut(auth);
$("tabs").onclick=e=>{let b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;cart=[];$("tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));render()};
onAuthStateChanged(auth,u=>{user=u;$("auth").classList.toggle("hidden",!!u);$("app").classList.toggle("hidden",!u);if(u){$("who").textContent=u.email;tab="dashboard";render()}});
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
